version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: tour_postgres
    environment:
      POSTGRES_DB: tour_operator
      POSTGRES_USER: tour_user
      POSTGRES_PASSWORD: tour_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tour_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tour_user -d tour_operator"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: tour_minio
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - tour_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tour_backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tour_operator
      SPRING_DATASOURCE_USERNAME: tour_user
      SPRING_DATASOURCE_PASSWORD: tour_password
      SPRING_MINIO_ENDPOINT: http://minio:9000
      SPRING_MINIO_ACCESS_KEY: minio_admin
      SPRING_MINIO_SECRET_KEY: minio_password
      JWT_SECRET: your-secret-key-for-jwt-tokens-must-be-long-enough
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    networks:
      - tour_network

networks:
  tour_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
